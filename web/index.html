<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moved: JSON Against Humanity</title>

  <style>
    @import "/lib/css/fonts/family-inter.css";

    body {
      margin-block: 3rem;
      font-family: var(--family-inter, sans-serif);
      font-weight: 500;
      font-size: 14pt;
      line-height: 1.5;
      text-align: center;
    }
    ul {
      width: fit-content;
      margin-inline: auto;
      text-align: start;
    }
    button {
      font: inherit;
    }
  </style>

  <link rel="icon" href="data:;">
</head>

<body>
  <div class="container wrapper">
    <h1>JSON Against Humanity has moved</h1>

    <p>Thank you to <a href="https://github.com/FireRat666/Json-Against-Humanity">FireRat</a> for reviving and modernizing this project.</p>

    <p>
      You will be forwarded to the <a href="https://jah.firer.at">new website</a> in <output id="countdown-output">10</output> seconds.
      <button id="stay-btn">Stay</button>
    </p>

    <ul>
      <li>New GitHub: <a href="https://github.com/FireRat666/Json-Against-Humanity">https://github.com/FireRat666/Json-Against-Humanity</a>.</li>
      <li>New Website: <a href="https://jah.firer.at">https://jah.firer.at</a>.</li>
    </ul>

    <p><a href="/index_old.html">Old Website</a>.</p>
  </div>

  <script>
    const countdownOutput = document.getElementById("countdown-output");
    const stayBtn = document.getElementById("stay-btn");

   let countdown = 10;
   const interval = setInterval(() => {
    countdownOutput.textContent = --countdown;

    if (countdown === 0) {
      location.assign("https://jah.firer.at");
    }
   }, 1000);

   stayBtn.addEventListener("click", function stay() {
    clearInterval(interval);
    stayBtn.closest("p").textContent = "Staying.";
   });
  </script>
</body>

</html>
